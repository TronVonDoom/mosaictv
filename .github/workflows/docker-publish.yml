name: Build and publish Docker image

# Builds the image on every push to main (published as :latest) and to the v2
# branch (published as :v2), and pushes to the GitHub Container Registry (GHCR).
# Unraid then just pulls the image — no building on the server. The package
# inherits the repo's visibility (private here).
#
# :latest only ever comes from the default branch (main), so the v2 branch can
# be soak-tested from its own :v2 image without ever touching the live :latest.

on:
  push:
    branches: [main, v2]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tronvondoom/mosaictv

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v2,enable=${{ github.ref == 'refs/heads/v2' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
